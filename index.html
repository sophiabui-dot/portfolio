<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Sophia Bui is an independent graphic designer creating colorful identities and visual worlds."
    >
    <title>Sophia Bui — Graphic Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        --ink: #111111;
        --paper: #ffffff;
        --blue: #3b9fe5;
        --pink: #f33440;
        --yellow: #ffdd1d;
        --green: #078d45;
        --display: "Fredoka", "Trebuchet MS", sans-serif;
        --gutter: 15px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      .page {
        border: 0;
        outline: 0;
        box-shadow: none;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        scroll-behavior: smooth;
        scrollbar-color: #3b9fe5 #ffffff;
        scrollbar-width: auto;
      }

      html::-webkit-scrollbar {
        width: 16px;
      }

      html::-webkit-scrollbar-track {
        background: #ffffff;
      }

      html::-webkit-scrollbar-thumb {
        border: 3px solid #ffffff;
        border-radius: 99px;
        background: #3b9fe5;
      }

      html::-webkit-scrollbar-thumb:hover {
        background: #086fba;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .custom-cursor {
        position: fixed;
        z-index: 20;
      }

      .drawing-canvas {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .drawing-capture {
        position: fixed;
        z-index: 19;
        inset: 0;
        display: none;
        touch-action: none;
      }

      .drawing-capture.is-active {
        display: block;
      }

      .drawing-toggle {
        position: fixed;
        z-index: 21;
        right: 18px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        display: grid;
        width: 50px;
        height: 50px;
        place-items: center;
        border: 1px solid rgb(17 17 17 / 12%);
        border-radius: 50%;
        background: var(--pink);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 5px 18px rgb(243 52 64 / 20%);
        transition:
          background 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .drawing-toggle:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgb(243 52 64 / 28%);
      }

      .drawing-toggle[aria-pressed="true"] {
        background: var(--green);
      }

      .drawing-toggle:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      .drawing-toggle svg {
        width: 23px;
        height: 23px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      body.is-drawing,
      body.is-drawing * {
        cursor: crosshair !important;
      }

      body.is-drawing .custom-cursor {
        display: none !important;
      }

      body.is-drawing .drawing-toggle {
        cursor: pointer !important;
      }

      .custom-cursor {
        top: 0;
        left: 0;
        display: none;
        width: 38px;
        height: 38px;
        pointer-events: none;
        transform: translate3d(-100px, -100px, 0);
      }

      .cursor-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--pink);
        transition: transform 180ms ease;
      }

      .custom-cursor.is-hovering .cursor-ring {
        transform: scale(1.25);
      }

      @media (hover: hover) and (pointer: fine) {
        body,
        body * {
          cursor: none !important;
        }

        .custom-cursor {
          display: block;
        }
      }

      .page {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }

      .masthead {
        position: absolute;
        z-index: 2;
        top: 31px;
        left: var(--gutter);
        display: flex;
        align-items: center;
        width: calc(100% - 2 * var(--gutter));
      }

      .brand {
        display: block;
        width: 83px;
        line-height: 0;
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .palette {
        display: flex;
        gap: 10px;
        margin-left: 12px;
      }

      .palette-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .palette-dot:nth-child(1) {
        background: var(--yellow);
      }

      .palette-dot:nth-child(2) {
        background: var(--pink);
      }

      .palette-dot:nth-child(3) {
        background: #086fba;
      }

      .palette-dot:nth-child(4) {
        background: var(--green);
      }

      .navigation {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 12px;
      }

      .palette {
        margin-left: 12px;
      }

      .navigation a,
      .navigation button {
        padding: 0;
        border: 0;
        background: #fff;
        border-radius: 99px;
        color: inherit;
        font: 600 11px var(--display);
        line-height: 1;
        padding: 8px 13px;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 2px 8px rgb(17 17 17 / 6%);
        transition:
          color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .navigation a:hover,
      .navigation button:hover {
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        transform: translateY(-2px) rotate(-2deg);
      }

      .navigation a:focus-visible,
      .navigation button:focus-visible,
      .project:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 4px;
      }

      .artwork {
        position: absolute;
        top: 50%;
        left: 66.6667%;
        width: min(68vw, 860px, calc(100vw - 36px));
        aspect-ratio: 1.4;
        transform: translate(-50%, -50%);
      }

      .project {
        position: absolute;
        top: var(--top);
        left: var(--left);
        z-index: var(--layer);
        display: block;
        width: var(--width);
        height: var(--height);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 7px 17px var(--card-shadow, rgb(17 17 17 / 14%));
        text-decoration: none;
        transition:
          z-index 0s,
          box-shadow 220ms ease;
        transform: translate3d(var(--float-x, 0px), var(--float-y, 0px), 0)
          rotate(var(--float-rotation, 0deg));
        will-change: transform;
      }

      .project img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 300ms ease;
      }

      .project:hover,
      .project:focus-visible {
        z-index: 10;
        box-shadow: 0 15px 35px var(--card-shadow, rgb(17 17 17 / 22%));
        transform: translate3d(var(--float-x, 0px), calc(var(--float-y, 0px) - 8px), 0)
          rotate(var(--float-rotation, 0deg)) scale(1.045);
      }

      .about-dialog {
        width: min(380px, calc(100% - 40px));
        padding: 25px;
        border: 3px solid var(--pink);
        border-radius: 20px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 12px 45px rgb(59 159 229 / 20%);
      }

      .about-dialog::backdrop {
        background: rgb(243 52 64 / 13%);
        backdrop-filter: blur(2px);
      }

      .about-dialog h2 {
        margin: 0 0 13px;
        color: var(--pink);
        font-family: var(--display);
        font-size: 25px;
        font-weight: 600;
      }

      .about-dialog p {
        margin: 0;
        color: #444;
        font-size: 13px;
        line-height: 1.65;
      }

      .dialog-close {
        display: block;
        margin-top: 19px;
        padding: 7px 14px;
        border: 0;
        border-radius: 99px;
        background: var(--yellow);
        color: var(--ink);
        font: 600 12px var(--display);
        cursor: pointer;
      }

      .dialog-close:hover {
        background: var(--yellow);
      }

      @media (max-width: 520px) {
        :root {
          --gutter: 15px;
        }

        .page {
          min-height: max(100svh, 620px);
        }

        .masthead {
          top: 24px;
        }

        .brand {
          width: 76px;
        }

        .navigation {
          gap: 7px;
        }

        .artwork {
          left: 50%;
          top: 55%;
          width: min(420px, calc(100vw - 34px));
        }

        .project {
          box-shadow: 0 5px 13px var(--card-shadow, rgb(17 17 17 / 16%));
        }
      }

      @media (max-width: 380px) {
        .navigation a,
        .navigation button {
          padding: 7px 6px;
          font-size: 10px;
        }

        .palette {
          gap: 6px;
        }

        .palette-dot {
          width: 9.6px;
          height: 9.6px;
        }
      }

      @media (hover: none) {
        .project {
          will-change: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .custom-cursor {
          display: none !important;
        }

        body,
        body * {
          cursor: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <canvas class="drawing-canvas" aria-hidden="true"></canvas>
      <header class="masthead">
        <a class="brand" href="#home" aria-label="Sophia Bui home">
          <img src="assets/sophia-bui-logo.png" alt="Sophia Bui">
        </a>
        <nav class="navigation" aria-label="Main navigation">
          <a href="#about">about</a>
          <a href="mailto:hello@sophiabui.design">contact</a>
        </nav>
        <div class="palette" aria-label="Brand colors" aria-hidden="true">
          <span class="palette-dot"></span>
          <span class="palette-dot"></span>
          <span class="palette-dot"></span>
          <span class="palette-dot"></span>
        </div>
      </header>

      <section class="artwork" aria-label="Selected graphic design projects">
        <a
          class="project"
          href="projects/personal-logo.html"
          aria-label="View the Personal Logo project"
          style="--left: 0%; --top: 30%; --width: 35.7%; --height: 41.7%; --layer: 1; --card-color: #f33440; --card-shadow: rgb(243 52 64 / 24%);"
        >
          <img
            src="assets/personal-logo-thumbnail.jpg"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/3d-render.html"
          aria-label="View the 3D Render project"
          style="--left: 25%; --top: 0%; --width: 47.6%; --height: 51%; --layer: 2; --card-color: #ffdd1d; --card-shadow: rgb(224 184 16 / 25%);"
        >
          <img
            src="assets/3d-render.png"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/good-earth.html"
          aria-label="View the Good Earth project"
          style="--left: 45%; --top: 25.3%; --width: 42%; --height: 44%; --layer: 3; --card-color: #3b9fe5; --card-shadow: rgb(59 159 229 / 26%);"
        >
          <img
            src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/garden-party.html"
          aria-label="View the Garden Party project"
          style="--left: 11.3%; --top: 64.5%; --width: 22%; --height: 35%; --layer: 4; --card-color: #078d45; --card-shadow: rgb(7 141 69 / 24%);"
        >
          <img
            src="assets/garden-party-thumbnail.png"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/other-worlds.html"
          aria-label="View the Other Worlds project"
          style="--left: 69.5%; --top: 47.3%; --width: 28.1%; --height: 46.7%; --layer: 5; --card-color: #f33440; --card-shadow: rgb(243 52 64 / 24%);"
        >
          <img
            src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/sixth-thumbnail.html"
          aria-label="View the Sixth Thumbnail project"
          style="--left: 29%; --top: 57%; --width: 25%; --height: 30%; --layer: 6; --card-color: #3b9fe5; --card-shadow: rgb(59 159 229 / 26%);"
        >
          <img
            src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>
      </section>

      <dialog class="about-dialog" id="about" aria-labelledby="about-title">
        <h2 id="about-title">A little about me</h2>
        <p>
          I’m Sophia, an independent graphic designer making thoughtful
          identities, art direction, and visual worlds for people with good
          ideas.
        </p>
        <button class="dialog-close" type="button">close</button>
      </dialog>
    </main>

    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-ring"></span>
    </div>

    <div class="drawing-capture" aria-hidden="true"></div>
    <button
      class="drawing-toggle"
      type="button"
      aria-label="Enable background drawing"
      aria-pressed="false"
      title="Draw on background"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 20 4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"></path>
        <path d="m14.8 7.7 3 3"></path>
      </svg>
    </button>

    <script>
      const aboutLink = document.querySelector('.navigation a[href="#about"]');
      const aboutDialog = document.querySelector(".about-dialog");
      const closeButton = document.querySelector(".dialog-close");
      const artwork = document.querySelector(".artwork");
      const projects = [...document.querySelectorAll(".project")];
      const customCursor = document.querySelector(".custom-cursor");
      const cursorRing = document.querySelector(".cursor-ring");
      const drawingCanvas = document.querySelector(".drawing-canvas");
      const drawingContext = drawingCanvas.getContext("2d");
      const drawingCapture = document.querySelector(".drawing-capture");
      const drawingToggle = document.querySelector(".drawing-toggle");
      let isDrawingEnabled = false;
      let activePointerId = null;
      let previousPoint = null;

      if (!drawingContext) {
        drawingToggle.disabled = true;
        drawingToggle.setAttribute("aria-label", "Background drawing is unavailable");
        drawingToggle.title = "Background drawing is unavailable";
      } else {
        function resizeDrawingCanvas() {
          const bounds = drawingCanvas.getBoundingClientRect();
          const width = Math.max(1, Math.round(bounds.width));
          const height = Math.max(1, Math.round(bounds.height));
          const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          const pixelWidth = Math.round(width * pixelRatio);
          const pixelHeight = Math.round(height * pixelRatio);

          if (
            drawingCanvas.width === pixelWidth &&
            drawingCanvas.height === pixelHeight
          ) {
            return;
          }

          const previousCanvas = document.createElement("canvas");
          previousCanvas.width = drawingCanvas.width;
          previousCanvas.height = drawingCanvas.height;

          if (previousCanvas.width && previousCanvas.height) {
            previousCanvas
              .getContext("2d")
              .drawImage(drawingCanvas, 0, 0);
          }

          drawingCanvas.width = pixelWidth;
          drawingCanvas.height = pixelHeight;
          drawingContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

          if (previousCanvas.width && previousCanvas.height) {
            drawingContext.drawImage(
              previousCanvas,
              0,
              0,
              previousCanvas.width,
              previousCanvas.height,
              0,
              0,
              width,
              height,
            );
          }

          drawingContext.lineWidth = 3;
          drawingContext.lineCap = "round";
          drawingContext.lineJoin = "round";
          drawingContext.strokeStyle = "#f33440";
        }

        function setDrawingEnabled(isEnabled) {
          isDrawingEnabled = isEnabled;
          document.body.classList.toggle("is-drawing", isEnabled);
          drawingCapture.classList.toggle("is-active", isEnabled);
          drawingToggle.setAttribute("aria-pressed", String(isEnabled));
          drawingToggle.setAttribute(
            "aria-label",
            isEnabled ? "Stop drawing" : "Enable background drawing",
          );
          drawingToggle.title = isEnabled
            ? "Stop drawing (Escape)"
            : "Draw on background";
        }

        function finishStroke(event) {
          if (event.pointerId !== activePointerId) {
            return;
          }

          activePointerId = null;
          previousPoint = null;
        }

        resizeDrawingCanvas();
        window.addEventListener("resize", resizeDrawingCanvas);

        drawingToggle.addEventListener("click", () => {
          setDrawingEnabled(!isDrawingEnabled);
        });

        drawingCapture.addEventListener("pointerdown", (event) => {
          if (!isDrawingEnabled) {
            return;
          }

          event.preventDefault();
          activePointerId = event.pointerId;
          previousPoint = {
            x: event.clientX,
            y: event.clientY,
          };
          drawingCapture.setPointerCapture(activePointerId);
        });

        drawingCapture.addEventListener("pointermove", (event) => {
          if (event.pointerId !== activePointerId || !previousPoint) {
            return;
          }

          const bounds = drawingCanvas.getBoundingClientRect();
          drawingContext.beginPath();
          drawingContext.moveTo(
            previousPoint.x - bounds.left,
            previousPoint.y - bounds.top,
          );
          drawingContext.lineTo(
            event.clientX - bounds.left,
            event.clientY - bounds.top,
          );
          drawingContext.stroke();
          previousPoint = {
            x: event.clientX,
            y: event.clientY,
          };
        });

        drawingCapture.addEventListener("pointerup", finishStroke);
        drawingCapture.addEventListener("pointercancel", finishStroke);
        drawingCapture.addEventListener("lostpointercapture", finishStroke);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && isDrawingEnabled) {
            setDrawingEnabled(false);
          }
        });
      }

      aboutLink.addEventListener("click", (event) => {
        event.preventDefault();
        aboutDialog.showModal();
      });

      closeButton.addEventListener("click", () => {
        aboutDialog.close();
      });

      aboutDialog.addEventListener("click", (event) => {
        if (event.target === aboutDialog) {
          aboutDialog.close();
        }
      });

      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        let cursorFrame = 0;
        let cursorX = -100;
        let cursorY = -100;

        document.addEventListener("pointermove", (event) => {
          cursorX = event.clientX;
          cursorY = event.clientY;

          if (!cursorFrame) {
            cursorFrame = requestAnimationFrame(() => {
              customCursor.style.transform =
                `translate3d(${cursorX - 19}px, ${cursorY - 19}px, 0)`;
              cursorFrame = 0;
            });
          }

          customCursor.classList.toggle(
            "is-hovering",
            event.target instanceof Element &&
              event.target.closest("a, button") !== null,
          );
        });

        document.addEventListener("pointerdown", () => {
          cursorRing.animate(
            [
              { transform: "scale(0.45)", opacity: 0.85 },
              { transform: "scale(1.65)", opacity: 0 },
            ],
            { duration: 440, easing: "cubic-bezier(0.16, 1, 0.3, 1)" },
          );

        });
      }

      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        const pointer = { x: 0, y: 0, active: false };
        const states = projects.map(() => ({
          x: 0,
          y: 0,
        }));
        let animationFrame = 0;
        let lastFrameTime = 0;

        function animateProjects(timestamp) {
          let isMoving = false;
          const elapsed = lastFrameTime
            ? Math.min(timestamp - lastFrameTime, 50)
            : 16;
          const easing = 1 - Math.exp(-elapsed / 650);
          lastFrameTime = timestamp;
          const artworkBounds = artwork.getBoundingClientRect();
          const radius = Math.min(artworkBounds.width * 0.48, 320);
          const maxOffset = 78;

          projects.forEach((project, index) => {
            const state = states[index];
            const centerX =
              artworkBounds.left + project.offsetLeft + project.offsetWidth / 2;
            const centerY =
              artworkBounds.top + project.offsetTop + project.offsetHeight / 2;
            let targetX = 0;
            let targetY = 0;

            if (pointer.active) {
              const dx = centerX - pointer.x;
              const dy = centerY - pointer.y;
              const distance = Math.hypot(dx, dy);

              if (distance > 0 && distance < radius) {
                const influence = (1 - distance / radius) ** 2;
                targetX = (dx / distance) * influence * maxOffset;
                targetY = (dy / distance) * influence * maxOffset;
              }
            }

            state.x += (targetX - state.x) * easing;
            state.y += (targetY - state.y) * easing;

            project.style.setProperty("--float-x", `${state.x.toFixed(2)}px`);
            project.style.setProperty("--float-y", `${state.y.toFixed(2)}px`);
            project.style.setProperty(
              "--float-rotation",
              `${(state.x * 0.035).toFixed(2)}deg`,
            );
            isMoving ||= Math.abs(state.x - targetX) > 0.1 ||
              Math.abs(state.y - targetY) > 0.1;
          });

          if (isMoving || pointer.active) {
            animationFrame = requestAnimationFrame(animateProjects);
          } else {
            animationFrame = 0;
          }
        }

        function startAnimation() {
          if (!animationFrame) {
            lastFrameTime = 0;
            animationFrame = requestAnimationFrame(animateProjects);
          }
        }

        artwork.addEventListener("pointermove", (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
          startAnimation();
        });

        artwork.addEventListener("pointerleave", () => {
          pointer.active = false;
          startAnimation();
        });
      }
    </script>
  </body>
</html>
