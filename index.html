<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Sophia Bui is an independent graphic designer creating colorful identities and visual worlds."
    >
    <title>Sophia Bui — Graphic Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        --ink: #111111;
        --paper: #ffffff;
        --blue: #3b9fe5;
        --pink: #f33440;
        --yellow: #ffdd1d;
        --green: #078d45;
        --display: "Fredoka", "Trebuchet MS", sans-serif;
        --gutter: 15px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      .page {
        border: 0;
        outline: 0;
        box-shadow: none;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        scroll-behavior: smooth;
        scrollbar-color: #3b9fe5 #ffffff;
        scrollbar-width: auto;
      }

      html::-webkit-scrollbar {
        width: 16px;
      }

      html::-webkit-scrollbar-track {
        background: #ffffff;
      }

      html::-webkit-scrollbar-thumb {
        border: 3px solid #ffffff;
        border-radius: 99px;
        background: #3b9fe5;
      }

      html::-webkit-scrollbar-thumb:hover {
        background: #086fba;
      }

      body {
        min-width: 320px;
        min-height: 100svh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .custom-cursor,
      .music-toggle {
        position: fixed;
        z-index: 20;
      }

      .custom-cursor {
        top: 0;
        left: 0;
        display: none;
        width: 38px;
        height: 38px;
        pointer-events: none;
        transform: translate3d(-100px, -100px, 0);
      }

      .cursor-ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--pink);
        transition: transform 180ms ease;
      }

      .custom-cursor.is-hovering .cursor-ring {
        transform: scale(1.25);
      }

      .music-toggle {
        right: 18px;
        bottom: 18px;
        display: inline-flex;
        min-height: 43px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 15px;
        border: 1px solid rgb(17 17 17 / 12%);
        border-radius: 99px;
        background: var(--pink);
        color: #fff;
        font: 600 12px var(--display);
        cursor: pointer;
        box-shadow: 0 5px 18px rgb(243 52 64 / 20%);
        transition:
          background 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .music-toggle:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgb(243 52 64 / 28%);
      }

      .music-toggle:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 4px;
      }

      .music-toggle:disabled {
        color: #727272;
        cursor: not-allowed;
      }

      .music-toggle svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5;
      }

      .music-toggle .sound-waves {
        display: none;
      }

      .music-toggle .sound-mute {
        display: block;
      }

      .music-toggle[aria-pressed="true"] .sound-waves {
        display: block;
      }

      .music-toggle[aria-pressed="true"] .sound-mute {
        display: none;
      }

      @media (hover: hover) and (pointer: fine) {
        body,
        body * {
          cursor: none !important;
        }

        .custom-cursor {
          display: block;
        }
      }

      .page {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
      }

      .masthead {
        position: absolute;
        z-index: 2;
        top: 31px;
        left: var(--gutter);
      }

      .brand {
        display: block;
        width: 83px;
        line-height: 0;
        text-decoration: none;
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .palette {
        position: absolute;
        top: 37px;
        right: 22px;
        display: flex;
        gap: 10px;
      }

      .palette-dot {
        width: 15px;
        height: 15px;
        border-radius: 50%;
      }

      .palette-dot:nth-child(1) {
        background: var(--yellow);
      }

      .palette-dot:nth-child(2) {
        background: var(--pink);
      }

      .palette-dot:nth-child(3) {
        background: #086fba;
      }

      .palette-dot:nth-child(4) {
        background: var(--green);
      }

      .navigation {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 15px;
      }

      .navigation a,
      .navigation button {
        padding: 0;
        border: 0;
        background: #fff;
        border-radius: 99px;
        color: inherit;
        font: 600 11px var(--display);
        line-height: 1;
        padding: 8px 13px;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 2px 8px rgb(17 17 17 / 6%);
        transition:
          color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .navigation a:hover,
      .navigation button:hover {
        background: var(--blue);
        color: #fff;
        text-decoration: none;
        transform: translateY(-2px) rotate(-2deg);
      }

      .navigation a:focus-visible,
      .navigation button:focus-visible,
      .project:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 4px;
      }

      .artwork {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(68vw, 860px, calc(100vw - 36px));
        aspect-ratio: 1.4;
        transform: translate(-50%, -50%);
      }

      .project {
        position: absolute;
        top: var(--top);
        left: var(--left);
        z-index: var(--layer);
        display: block;
        width: var(--width);
        height: var(--height);
        overflow: hidden;
        background: #fff;
        box-shadow: 0 7px 17px var(--card-shadow, rgb(17 17 17 / 14%));
        text-decoration: none;
        transition:
          z-index 0s,
          box-shadow 220ms ease;
        transform: translate3d(var(--float-x, 0px), var(--float-y, 0px), 0)
          rotate(var(--float-rotation, 0deg));
        will-change: transform;
      }

      .project img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 300ms ease;
      }

      .project:hover,
      .project:focus-visible {
        z-index: 10;
        box-shadow: 0 15px 35px var(--card-shadow, rgb(17 17 17 / 22%));
        transform: translate3d(var(--float-x, 0px), calc(var(--float-y, 0px) - 8px), 0)
          rotate(var(--float-rotation, 0deg)) scale(1.045);
      }

      .about-dialog {
        width: min(380px, calc(100% - 40px));
        padding: 25px;
        border: 3px solid var(--pink);
        border-radius: 20px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 12px 45px rgb(59 159 229 / 20%);
      }

      .about-dialog::backdrop {
        background: rgb(243 52 64 / 13%);
        backdrop-filter: blur(2px);
      }

      .about-dialog h2 {
        margin: 0 0 13px;
        color: var(--pink);
        font-family: var(--display);
        font-size: 25px;
        font-weight: 600;
      }

      .about-dialog p {
        margin: 0;
        color: #444;
        font-size: 13px;
        line-height: 1.65;
      }

      .dialog-close {
        display: block;
        margin-top: 19px;
        padding: 7px 14px;
        border: 0;
        border-radius: 99px;
        background: var(--yellow);
        color: var(--ink);
        font: 600 12px var(--display);
        cursor: pointer;
      }

      .dialog-close:hover {
        background: var(--yellow);
      }

      @media (max-width: 520px) {
        :root {
          --gutter: 15px;
        }

        .page {
          min-height: max(100svh, 620px);
        }

        .masthead {
          top: 24px;
        }

        .brand {
          width: 76px;
        }

        .navigation {
          gap: 7px;
          margin-top: 16px;
        }

        .artwork {
          top: 55%;
          width: min(420px, calc(100vw - 34px));
        }

        .project {
          box-shadow: 0 5px 13px var(--card-shadow, rgb(17 17 17 / 16%));
        }
      }

      @media (hover: none) {
        .project {
          will-change: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .custom-cursor {
          display: none !important;
        }

        body,
        body * {
          cursor: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <a class="brand" href="#home" aria-label="Sophia Bui home">
          <img src="assets/sophia-bui-logo.png" alt="Sophia Bui">
        </a>
        <nav class="navigation" aria-label="Main navigation">
          <a href="#about">about</a>
          <a href="mailto:hello@sophiabui.design">contact</a>
        </nav>
      </header>

      <div class="palette" aria-label="Brand colors" aria-hidden="true">
        <span class="palette-dot"></span>
        <span class="palette-dot"></span>
        <span class="palette-dot"></span>
        <span class="palette-dot"></span>
      </div>

      <section class="artwork" aria-label="Selected graphic design projects">
        <a
          class="project"
          href="projects/slow-sunday.html"
          aria-label="View the Slow Sunday project"
          style="--left: 0%; --top: 30%; --width: 35.7%; --height: 41.7%; --layer: 1; --card-color: #f33440; --card-shadow: rgb(243 52 64 / 24%);"
        >
          <img
            src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/soft-forms.html"
          aria-label="View the Soft Forms project"
          style="--left: 25%; --top: 0%; --width: 47.6%; --height: 51%; --layer: 2; --card-color: #ffdd1d; --card-shadow: rgb(224 184 16 / 25%);"
        >
          <img
            src="https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/good-earth.html"
          aria-label="View the Good Earth project"
          style="--left: 45%; --top: 25.3%; --width: 42%; --height: 44%; --layer: 3; --card-color: #3b9fe5; --card-shadow: rgb(59 159 229 / 26%);"
        >
          <img
            src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&amp;fit=crop&amp;w=700&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/garden-party.html"
          aria-label="View the Garden Party project"
          style="--left: 11.3%; --top: 64.5%; --width: 22%; --height: 35%; --layer: 4; --card-color: #078d45; --card-shadow: rgb(7 141 69 / 24%);"
        >
          <img
            src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/other-worlds.html"
          aria-label="View the Other Worlds project"
          style="--left: 69.5%; --top: 47.3%; --width: 28.1%; --height: 46.7%; --layer: 5; --card-color: #f33440; --card-shadow: rgb(243 52 64 / 24%);"
        >
          <img
            src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>

        <a
          class="project"
          href="projects/sixth-thumbnail.html"
          aria-label="View the Sixth Thumbnail project"
          style="--left: 29%; --top: 57%; --width: 25%; --height: 30%; --layer: 6; --card-color: #3b9fe5; --card-shadow: rgb(59 159 229 / 26%);"
        >
          <img
            src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&amp;fit=crop&amp;w=600&amp;q=80"
            alt=""
          >
        </a>
      </section>

      <dialog class="about-dialog" id="about" aria-labelledby="about-title">
        <h2 id="about-title">A little about me</h2>
        <p>
          I’m Sophia, an independent graphic designer making thoughtful
          identities, art direction, and visual worlds for people with good
          ideas.
        </p>
        <button class="dialog-close" type="button">close</button>
      </dialog>
    </main>

    <div class="custom-cursor" aria-hidden="true">
      <span class="cursor-ring"></span>
    </div>

    <button
      class="music-toggle"
      type="button"
      aria-label="Play background music"
      aria-pressed="false"
    >
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M9 4 5.5 7H3v6h2.5L9 16V4Z"></path>
        <path class="sound-waves" d="M12 7.2a4 4 0 0 1 0 5.6M14.5 4.8a7.4 7.4 0 0 1 0 10.4"></path>
        <path class="sound-mute" d="m12 8 4 4m0-4-4 4"></path>
      </svg>
      <span class="music-label">Play music</span>
    </button>

    <script>
      const aboutLink = document.querySelector('.navigation a[href="#about"]');
      const aboutDialog = document.querySelector(".about-dialog");
      const closeButton = document.querySelector(".dialog-close");
      const artwork = document.querySelector(".artwork");
      const projects = [...document.querySelectorAll(".project")];
      const customCursor = document.querySelector(".custom-cursor");
      const cursorRing = document.querySelector(".cursor-ring");
      const musicButton = document.querySelector(".music-toggle");
      const musicLabel = document.querySelector(".music-label");

      aboutLink.addEventListener("click", (event) => {
        event.preventDefault();
        aboutDialog.showModal();
      });

      closeButton.addEventListener("click", () => {
        aboutDialog.close();
      });

      aboutDialog.addEventListener("click", (event) => {
        if (event.target === aboutDialog) {
          aboutDialog.close();
        }
      });

      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        let cursorFrame = 0;
        let cursorX = -100;
        let cursorY = -100;

        document.addEventListener("pointermove", (event) => {
          cursorX = event.clientX;
          cursorY = event.clientY;

          if (!cursorFrame) {
            cursorFrame = requestAnimationFrame(() => {
              customCursor.style.transform =
                `translate3d(${cursorX - 19}px, ${cursorY - 19}px, 0)`;
              cursorFrame = 0;
            });
          }

          customCursor.classList.toggle(
            "is-hovering",
            event.target instanceof Element &&
              event.target.closest("a, button") !== null,
          );
        });

        document.addEventListener("pointerdown", () => {
          cursorRing.animate(
            [
              { transform: "scale(0.45)", opacity: 0.85 },
              { transform: "scale(1.65)", opacity: 0 },
            ],
            { duration: 440, easing: "cubic-bezier(0.16, 1, 0.3, 1)" },
          );

        });
      }

      const AudioContextClass = window.AudioContext;

      if (!AudioContextClass) {
        musicButton.disabled = true;
        musicLabel.textContent = "Music unavailable";
        musicButton.setAttribute("aria-label", "Background music is unavailable");
      } else {
        const audioContext = new AudioContextClass();
        const sampleRate = audioContext.sampleRate;
        const chordDuration = 4;
        const chordNotes = [
          [130.81, 164.81, 196, 246.94],
          [110, 130.81, 164.81, 196],
          [87.31, 110, 130.81, 174.61],
          [98, 123.47, 146.83, 196],
        ];
        const audioBuffer = audioContext.createBuffer(
          1,
          Math.floor(sampleRate * chordDuration * chordNotes.length),
          sampleRate,
        );
        const samples = audioBuffer.getChannelData(0);
        const crossfadeDuration = 0.55;

        for (let frame = 0; frame < samples.length; frame += 1) {
          const time = frame / sampleRate;
          const chordPosition = time % chordDuration;
          const chord = chordNotes[Math.floor(time / chordDuration)];
          const envelope = Math.min(
            1,
            chordPosition / crossfadeDuration,
            (chordDuration - chordPosition) / crossfadeDuration,
          );
          let sound = 0;

          for (const frequency of chord) {
            const phase = 2 * Math.PI * frequency * time;
            const voice = Math.sin(phase) + 0.16 * Math.sin(phase * 2);
            sound += voice / chord.length;
          }

          samples[frame] = sound * envelope * 0.45;
        }

        const musicSource = audioContext.createBufferSource();
        const musicGain = audioContext.createGain();
        musicSource.buffer = audioBuffer;
        musicSource.loop = true;
        musicGain.gain.value = 0;
        musicSource.connect(musicGain);
        musicGain.connect(audioContext.destination);
        musicSource.start();

        let musicEnabled = false;
        let musicChange = 0;

        function updateMusicButton(isEnabled) {
          musicEnabled = isEnabled;
          musicButton.setAttribute("aria-pressed", String(isEnabled));
          musicButton.setAttribute(
            "aria-label",
            isEnabled ? "Mute background music" : "Play background music",
          );
          musicLabel.textContent = isEnabled ? "Mute music" : "Play music";
        }

        function setMusicEnabled(isEnabled) {
          const change = ++musicChange;

          if (!isEnabled) {
            updateMusicButton(false);
            musicGain.gain.cancelScheduledValues(audioContext.currentTime);
            musicGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.16);
            return;
          }

          audioContext.resume().then(() => {
            if (change !== musicChange) {
              return;
            }

            updateMusicButton(true);
            musicGain.gain.cancelScheduledValues(audioContext.currentTime);
            musicGain.gain.setTargetAtTime(0.1, audioContext.currentTime, 0.35);
          }).catch((error) => {
            if (change !== musicChange) {
              return;
            }

            console.error("Background music could not be started.", error);
            updateMusicButton(false);
          });
        }

        musicButton.addEventListener("click", () => {
          setMusicEnabled(!musicEnabled);
        });

        setMusicEnabled(true);
      }

      if (
        window.matchMedia("(hover: hover) and (pointer: fine)").matches &&
        !window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ) {
        const pointer = { x: 0, y: 0, active: false };
        const states = projects.map(() => ({
          x: 0,
          y: 0,
        }));
        let animationFrame = 0;
        let lastFrameTime = 0;

        function animateProjects(timestamp) {
          let isMoving = false;
          const elapsed = lastFrameTime
            ? Math.min(timestamp - lastFrameTime, 50)
            : 16;
          const easing = 1 - Math.exp(-elapsed / 650);
          lastFrameTime = timestamp;
          const artworkBounds = artwork.getBoundingClientRect();
          const radius = Math.min(artworkBounds.width * 0.36, 240);
          const maxOffset = 52;

          projects.forEach((project, index) => {
            const state = states[index];
            const centerX =
              artworkBounds.left + project.offsetLeft + project.offsetWidth / 2;
            const centerY =
              artworkBounds.top + project.offsetTop + project.offsetHeight / 2;
            let targetX = 0;
            let targetY = 0;

            if (pointer.active) {
              const dx = centerX - pointer.x;
              const dy = centerY - pointer.y;
              const distance = Math.hypot(dx, dy);

              if (distance > 0 && distance < radius) {
                const influence = (1 - distance / radius) ** 2;
                targetX = (dx / distance) * influence * maxOffset;
                targetY = (dy / distance) * influence * maxOffset;
              }
            }

            state.x += (targetX - state.x) * easing;
            state.y += (targetY - state.y) * easing;

            project.style.setProperty("--float-x", `${state.x.toFixed(2)}px`);
            project.style.setProperty("--float-y", `${state.y.toFixed(2)}px`);
            project.style.setProperty(
              "--float-rotation",
              `${(state.x * 0.025).toFixed(2)}deg`,
            );
            isMoving ||= Math.abs(state.x - targetX) > 0.1 ||
              Math.abs(state.y - targetY) > 0.1;
          });

          if (isMoving || pointer.active) {
            animationFrame = requestAnimationFrame(animateProjects);
          } else {
            animationFrame = 0;
          }
        }

        function startAnimation() {
          if (!animationFrame) {
            lastFrameTime = 0;
            animationFrame = requestAnimationFrame(animateProjects);
          }
        }

        artwork.addEventListener("pointermove", (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
          startAnimation();
        });

        artwork.addEventListener("pointerleave", () => {
          pointer.active = false;
          startAnimation();
        });
      }
    </script>
  </body>
</html>
